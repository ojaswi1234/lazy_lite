name: LazyLite Setup & CI Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-linux:
    name: Test Linux Auto-Setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run install.sh (Unattended)
        run: |
          chmod +x ./install.sh
          ./install.sh -y --skip-lite --skip-agy

      - name: Verify installed configuration
        run: |
          test -d "$HOME/.config/lite-xl/plugins"
          test -d "$HOME/.config/lite-xl/scripts"
          test -f "$HOME/.config/lite-xl/init.lua"
          test -f "$HOME/.config/lite-xl/plugins/lsp_setup.lua"
          test -f "$HOME/.config/lite-xl/plugins/antigravity_sidebar.lua"
          test -f "$HOME/.config/lite-xl/plugins/agent_capabilities.lua"
          test -f "$HOME/.config/lite-xl/plugins/ai_tool_registry.lua"
          python3 -m py_compile "$HOME/.config/lite-xl/scripts/ai_api_bridge.py"
          python3 -c "from langgraph.checkpoint.sqlite import SqliteSaver; print('SqliteSaver OK')"
          python3 "$HOME/.config/lite-xl/scripts/ai_api_bridge.py" --get-history | grep -q "return {}"
          echo "Linux setup verification passed!"

  test-macos:
    name: Test macOS Auto-Setup
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run install.sh (Unattended)
        run: |
          chmod +x ./install.sh
          ./install.sh -y --skip-lite --skip-agy

      - name: Verify installed configuration
        run: |
          test -d "$HOME/.config/lite-xl/plugins" || test -d "$HOME/Library/Application Support/lite-xl/plugins"
          echo "macOS setup verification passed!"

  test-windows:
    name: Test Windows Auto-Setup
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run install.ps1 (Unattended)
        shell: pwsh
        run: |
          .\install.ps1 -Unattended -SkipLiteXl -SkipAgy

      - name: Verify installed configuration
        shell: pwsh
        run: |
          $cfg = "$env:USERPROFILE\.config\lite-xl"
          if (-not (Test-Path "$cfg\plugins") -or -not (Test-Path "$cfg\init.lua")) {
            throw "Installation check failed!"
          }
          foreach ($f in @("plugins\antigravity_sidebar.lua", "plugins\agent_capabilities.lua", "plugins\ai_tool_registry.lua", "scripts\ai_api_bridge.py")) {
            if (-not (Test-Path "$cfg\$f")) { throw "Missing expected file: $f" }
          }
          python -m py_compile "$cfg\scripts\ai_api_bridge.py"
          python -c "from langgraph.checkpoint.sqlite import SqliteSaver; print('SqliteSaver OK')"
          $hist = python "$cfg\scripts\ai_api_bridge.py" --get-history
          if ($hist -notmatch "return \{\}") { throw "Unexpected --get-history output: $hist" }
          Write-Host "Windows setup verification passed!"
